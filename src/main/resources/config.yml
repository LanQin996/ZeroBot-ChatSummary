# 生成报告所需权限节点。
# reportDefaultAllowed 为 true 时，没有权限插件接管的情况下默认允许所有人使用。
reportPermission: chat-summary.report
reportDefaultAllowed: true
noPermissionReply: 你没有权限生成群聊总结

# 是否先回复“正在生成”。群聊较活跃或开启 AI 时建议改成 true。
sendGeneratingReply: false

# 影响“今日/昨天”和报告时间显示。
timeZone: Asia/Shanghai

# 默认统计最近多少小时。
defaultHours: 24

# 单次命令允许查询的最大小时数。
maxHours: 168

# 内存里保留最近多少小时的群消息，至少应不小于 maxHours。
retentionHours: 168

# 每个群最多缓存多少条消息，防止长期运行占用过多内存。
maxMessagesPerGroup: 6000

# 是否把群消息追加写入 JSONL 文件。开启后重启插件也能读取历史上下文。
storageEnabled: true

# JSONL 历史消息保留天数。文件保存在 data/chat-summary/messages/<群号>/<日期>.jsonl。
storageRetentionDays: 7

# 定期清理间隔，单位分钟。会清理过期 JSONL 文件和内存中的过期群聊缓存。
cleanupIntervalMinutes: 60

# 是否下载并缓存群头像和 QQ 头像，用于报告头像展示。下载失败会自动使用占位头像。
avatarEnabled: true

# 头像缓存保留天数。文件保存在 data/chat-summary/avatars/。
avatarCacheDays: 7

# 单个头像下载超时时间，单位秒。
avatarDownloadTimeoutSeconds: 5

# 是否缓存群友发出的图片，用于报告里的“图片速览”。下载失败不会影响总结生成。
imageCacheEnabled: true

# 群聊图片缩略图缓存保留天数。文件保存在 data/chat-summary/images/<群号>/<日期>/。
imageCacheDays: 7

# 单张群聊图片下载超时时间，单位秒。
imageDownloadTimeoutSeconds: 10

# 报告中最多展示最近多少张已缓存群聊图片。设为 0 可关闭图片速览模块。
imagePreviewLimit: 6

# 忽略以 /、!、！、. 开头的普通消息，避免命令文本进入报告。
ignoreCommandLikeMessages: true

# 报告设计宽度。renderScale 会放大实际输出像素，让文字更清晰。
reportWidth: 560
renderScale: 2

# 各个报告模块的展示数量限制。
topUserLimit: 12
hotWordLimit: 60
minHotWordCount: 2
topicLimit: 5
profileLimit: 6
interactionLimit: 7
quoteLimit: 5
minQuoteLength: 10
maxQuoteLength: 90

# AI 报告策划默认关闭。开启后由 AI 决定摘要、热词、话题、群奖项、画像和金句。
# 消息数、参与人数、活跃时段等统计数据仍由插件本地计算，避免 AI 改写事实。
aiEnabled: true

# OpenAI Chat Completions 兼容接口地址。
# OpenAI 官方保持默认值；OneAPI、DeepSeek 兼容网关或自建代理可改成对应 /v1 地址。
aiBaseUrl: https://api.openai.com/v1

# 可以直接填写 key；更推荐留空并使用 aiApiKeyEnv 指定的环境变量。
aiApiKey: ""
aiApiKeyEnv: OPENAI_API_KEY

# 默认模型。使用兼容网关时，改成服务商支持的模型名。
aiModel: gpt-5.4-nano

# AI 请求超时时间，单位秒。
aiTimeoutSeconds: 120

# 发送给 AI 的聊天记录上限。上下文越多，报告越容易抓到真正精华，也会增加 token 消耗。
aiMaxMessages: 360
aiMaxChars: 30000

# AI 回复 token 上限。报告内容越丰富，这里可以适当调高。
aiMaxOutputTokens: 2200

# 是否把已缓存的群聊图片缩略图一起发送给 AI。需要模型支持视觉输入，开启后会增加消耗。
aiImageInputEnabled: false

# 单次最多发送给 AI 的图片数量，只取报告窗口内最近的已缓存图片。
aiImageInputLimit: 4

# -1 表示不发送 temperature 参数，兼容不同模型；需要时可改为 0.2、0.4 等。
aiTemperature: -1
